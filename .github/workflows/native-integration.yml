name: Native plugin integration

on:
  workflow_call:
    inputs:
      source_ref:
        description: Private source revision to validate
        type: string
        required: false
        default: main
    secrets:
      GDPP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source revision to validate
        type: string
        required: false
        default: main

permissions:
  contents: read

env:
  GDPP_SOURCE_ROOT: ${{ github.workspace }}/source

defaults:
  run:
    working-directory: source

concurrency:
  group: native-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out public pipeline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GDPP_TOKEN }}
      - name: Initialize the MSVC x64 toolchain
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64
      - name: Configure compiler GDExtension
        shell: bash
        run: |
          arguments=(--preset plugin)
          if [[ "$RUNNER_OS" == Windows ]]; then
            arguments+=("-DCMAKE_CXX_COMPILER=cl.exe")
          fi
          cmake "${arguments[@]}"
      - name: Build compiler, SDK and generated-code smoke target
        run: cmake --build --preset plugin --parallel
      - name: Test standalone MSVC export environment bootstrap
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -E rm -rf example/addons/gdpp/build/project/native-direct
          env -u INCLUDE -u LIB -u LIBPATH \
            ctest --test-dir build/plugin -R '^gdpp\.godot\.direct_export_build$' --output-on-failure
      - name: Run GDExtension and export-build tests
        run: ctest --preset plugin
      - name: Remove example project native products
        run: >-
          cmake
          -DGDPP_ADDON_DIRECTORY="$GDPP_SOURCE_ROOT/example/addons/gdpp"
          -P cmake/CleanAddonBuild.cmake
      - name: Upload non-release plugin diagnostic bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gdpp-plugin-${{ runner.os }}-${{ runner.arch }}
          path: source/example/addons/gdpp
          if-no-files-found: error
          retention-days: 7

  custom-double:
    name: Plugin / Custom Godot double
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out public pipeline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GDPP_TOKEN }}
      - name: Create an exact custom double-precision API
        shell: bash
        run: |
          mkdir -p build/ci-custom-double-input
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("api/extension_api-4.7.json")
          output = Path("build/ci-custom-double-input/extension_api.json")
          api = json.loads(source.read_text(encoding="utf-8"))
          api["header"]["version_build"] = "gdpp_ci_custom_double"
          api["header"]["precision"] = "double"
          output.write_text(
              json.dumps(api, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
      - name: Configure the custom compiler, SDK and add-on
        shell: bash
        run: |
          cmake -S . -B build/ci-custom-double -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGDPP_BUILD_TESTS=ON \
            -DGDPP_BUILD_CLI=ON \
            -DGDPP_BUILD_EXTENSION=ON \
            -DGDPP_GODOT_PRECISION=double \
            -DGDPP_CUSTOM_GDEXTENSION_API_FILE="$PWD/build/ci-custom-double-input/extension_api.json" \
            -DGDPP_PACKAGE_GODOT_VERSIONS=4.7
      - name: Build the complete custom add-on
        run: >-
          cmake --build build/ci-custom-double
          --target gdpp_custom_addon gdpp_double_precision_native_layout_contract
          gdpp_gde_host_adapter_enum_boundary gdpp_c_abi_header_contract
          --parallel
      - name: Verify double-precision native layout and exact-value transport
        run: >-
          ctest --test-dir build/ci-custom-double
          -R '^gdpp\.(runtime\.(double_precision_native_layout|godot_native_size_contract)|gde_host_adapter\.enum_boundary)$'
          --output-on-failure
      - name: Audit the custom ABI package
        shell: bash
        run: |
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' \
            build/ci-custom-double/CMakeCache.txt)"
          test -n "$version"
          python3 tools/audit_custom_addon.py \
            --addon build/ci-custom-double/custom-addon/addons/gdpp \
            --api build/ci-custom-double-input/extension_api.json \
            --version "$version" \
            --godot-version 4.7 \
            --precision double
