name: Native plugin integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - name: Initialize the MSVC x64 toolchain
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64
      - name: Configure compiler GDExtension
        shell: bash
        run: |
          arguments=(--preset plugin)
          if [[ "$RUNNER_OS" == Windows ]]; then
            arguments+=("-DCMAKE_CXX_COMPILER=cl.exe")
          fi
          cmake "${arguments[@]}"
      - name: Build compiler, SDK and generated-code smoke target
        run: cmake --build --preset plugin --parallel
      - name: Test standalone MSVC export environment bootstrap
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -E rm -rf example/addons/gdpp/build/project/native-direct
          env -u INCLUDE -u LIB -u LIBPATH \
            ctest --test-dir build/plugin -R '^gdpp\.godot\.direct_export_build$' --output-on-failure
      - name: Run GDExtension and export-build tests
        run: ctest --preset plugin
      - name: Remove example project native products
        run: >-
          cmake
          -DGDPP_ADDON_DIRECTORY=${{ github.workspace }}/example/addons/gdpp
          -P cmake/CleanAddonBuild.cmake
      - name: Upload non-release plugin diagnostic bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gdpp-plugin-${{ runner.os }}-${{ runner.arch }}
          path: example/addons/gdpp
          if-no-files-found: error
          retention-days: 7

  custom-double:
    name: Plugin / Custom Godot double
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive
      - name: Create an exact custom double-precision API
        shell: bash
        run: |
          mkdir -p build/ci-custom-double-input
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("third/godot-cpp/gdextension/extension_api.json")
          output = Path("build/ci-custom-double-input/extension_api.json")
          api = json.loads(source.read_text(encoding="utf-8"))
          api["header"]["version_build"] = "gdpp_ci_custom_double"
          api["header"]["precision"] = "double"
          output.write_text(
              json.dumps(api, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
      - name: Configure the custom compiler, SDK and add-on
        shell: bash
        run: |
          cmake -S . -B build/ci-custom-double -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGDPP_BUILD_TESTS=OFF \
            -DGDPP_BUILD_CLI=ON \
            -DGDPP_BUILD_EXTENSION=ON \
            -DGDPP_GODOT_PRECISION=double \
            -DGDPP_CUSTOM_GDEXTENSION_API_FILE="$PWD/build/ci-custom-double-input/extension_api.json" \
            -DGDPP_PACKAGE_GODOT_VERSIONS=4.7
      - name: Build the complete custom add-on
        run: cmake --build build/ci-custom-double --target gdpp_custom_addon --parallel
      - name: Audit the custom ABI package
        shell: bash
        run: |
          python3 tools/audit_custom_addon.py \
            --addon build/ci-custom-double/custom-addon/addons/gdpp \
            --api build/ci-custom-double-input/extension_api.json \
            --version 1.8.1 \
            --godot-version 4.7 \
            --precision double
