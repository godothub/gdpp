name: Android target and export

on:
  workflow_call:
    inputs:
      source_ref:
        description: Private source revision to validate
        type: string
        required: false
        default: main
    secrets:
      GDPP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source revision to validate
        type: string
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GDPP_ANDROID_NDK_VERSION: 28.1.13356709
  GDPP_SOURCE_ROOT: ${{ github.workspace }}/source

defaults:
  run:
    working-directory: source

jobs:
  target-sdk:
    name: Android Host SDK / arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out public pipeline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - id: source
        uses: ./.github/actions/checkout-source
        with:
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GDPP_TOKEN }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''
      - name: Install pinned NDK
        shell: bash
        run: sdkmanager "ndk;$GDPP_ANDROID_NDK_VERSION"
      - name: Configure target SDK builder
        shell: bash
        run: >-
          cmake --preset dev
          -DGDPP_ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$GDPP_ANDROID_NDK_VERSION"
          -DGDPP_BUILD_ANDROID_SDK=ON
          -DGDPP_ANDROID_ARCHITECTURES=arm64
      - name: Build Android Release target SDK
        run: cmake --build --preset dev --target gdpp_android_sdk --parallel
      - name: Validate target SDK contract
        shell: bash
        run: |
          set -euo pipefail
          sdk="example/addons/gdpp/sdk/lib/android/arm64"
          grep -q '^platform android$' "$sdk/sdk.manifest"
          grep -q '^arch arm64$' "$sdk/sdk.manifest"
          grep -q '^profiles debug,release$' "$sdk/sdk.manifest"
          grep -q '^engine_range 4.4-4.7$' "$sdk/sdk.manifest"
          grep -q '^host_abi 1$' "$sdk/sdk.manifest"
          grep -q '^script_abi 1$' "$sdk/sdk.manifest"
          grep -q '^precision single$' "$sdk/sdk.manifest"
          grep -q '^exceptions enabled$' "$sdk/sdk.manifest"
          grep -q '^android_api_level 28$' "$sdk/sdk.manifest"
          test "$(find "$sdk" -maxdepth 1 -type f -name '*.a' | wc -l)" -eq 1
          test -f example/addons/gdpp/sdk/include/gdextension_interface.h
      - name: Seal the source-bound target SDK artifact
        shell: bash
        env:
          ARTIFACT_NAME: gdpp-android-arm64-${{ steps.source.outputs.sha }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          artifact="build/component-artifacts/$ARTIFACT_NAME"
          test ! -e "$artifact"
          mkdir -p "$artifact/lib/android"
          cp -R example/addons/gdpp/sdk/include "$artifact/include"
          cp -R example/addons/gdpp/sdk/lib/android/arm64 "$artifact/lib/android/arm64"
          python3 "$GITHUB_WORKSPACE/.github/tools/component_artifact.py" seal \
            --root "$artifact" \
            --artifact-name "$ARTIFACT_NAME" \
            --source-sha "$SOURCE_SHA"
      - name: Upload target SDK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gdpp-android-arm64-${{ steps.source.outputs.sha }}
          path: source/build/component-artifacts/gdpp-android-arm64-${{ steps.source.outputs.sha }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  apk:
    name: Android APK / Godot 4.5.2 / arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out public pipeline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GDPP_TOKEN }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          source-root: ${{ env.GDPP_SOURCE_ROOT }}
          version: 4.5.2
          templates: android
      - name: Install pinned Android toolchain
        shell: bash
        run: >-
          sdkmanager
          "ndk;$GDPP_ANDROID_NDK_VERSION"
          "platforms;android-35"
          "build-tools;35.0.0"
      - name: Isolate Godot Android settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" \
            > "$HOME/.config/godot/editor_settings-4.5.tres"
      - name: Build compiler plugin and Android target SDK
        shell: bash
        env:
          GODOT: ${{ steps.godot.outputs.executable }}
        run: |
          cmake --preset plugin \
            -DGDPP_GODOT_EXECUTABLE="$GODOT" \
            -DGDPP_ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$GDPP_ANDROID_NDK_VERSION" \
            -DGDPP_BUILD_ANDROID_SDK=ON \
            -DGDPP_ANDROID_ARCHITECTURES=arm64
          cmake --build --preset plugin --parallel
          cmake --build --preset plugin --target gdpp_android_sdk --parallel
      - name: Export and audit binary-only APK
        shell: bash
        env:
          GODOT: ${{ steps.godot.outputs.executable }}
        run: |
          set -euo pipefail
          root="$GDPP_SOURCE_ROOT/example/addons/gdpp/build/android"
          mkdir -p "$root/audit"
          "$GODOT" --headless --editor --path example --quit-after 120 \
            2>&1 | tee "$root/warmup.log"
          "$GODOT" --headless --editor --path example --import \
            2>&1 | tee "$root/import.log"
          python3 tools/verify_export_immutability.py snapshot \
            --project example --state "$root/extension-state.json"
          "$GODOT" --headless --editor --path example \
            --export-release 'Android arm64' "$root/GDPPExample.apk" \
            2>&1 | tee "$root/export.log"
          python3 tools/verify_export_immutability.py verify \
            --project example --state "$root/extension-state.json"
          apk="$root/GDPPExample.apk"
          test -f "$apk"
          project_library='lib/arm64-v8a/libgdpp.release.android.arm64.so'
          pck="$root/audit/GDPPExample.pck"
          python3 tools/audit_export_payload.py \
            --zip "$apk" \
            --platform android \
            --architecture arm64 \
            --extract-pck "$pck" \
            --report "$root/payload-audit.json" \
            2>&1 | tee "$root/payload-audit.log"
          grep -q '^EXPORT_PAYLOAD_VIOLATIONS=0$' "$root/payload-audit.log"
          project_so="$root/audit/libgdpp.release.android.arm64.so"
          unzip -p "$apk" "$project_library" > "$project_so"
          llvm_bin="$ANDROID_SDK_ROOT/ndk/$GDPP_ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$llvm_bin/llvm-readelf" -h "$project_so" | \
            grep -Eq 'Machine:[[:space:]]+AArch64$'
          test "$("$llvm_bin/llvm-nm" -D --defined-only "$project_so" | awk 'NF {print $NF}' | wc -l)" -eq 1
          "$llvm_bin/llvm-nm" -D --defined-only "$project_so" | awk 'NF {print $NF}' | \
            grep -qx gdpp_library_init
          if "$llvm_bin/llvm-readelf" -S "$project_so" | grep '\.symtab' >/dev/null; then
            echo 'Android Release project library contains a normal symbol table.'
            exit 1
          fi

          audit_host="$root/pck-audit"
          audit_harness="$audit_host/gdpp-pck-audit-$(python3 -c \
            'import secrets; print(secrets.token_hex(16))')"
          audit_harness_name="${audit_harness##*/}"
          mkdir -p "$audit_harness"
          cp tools/audit_export_pck.gd "$audit_harness/audit_export_pck.gd"
          printf '[application]\nconfig/name="GDPP Android PCK Audit"\n' \
            > "$audit_host/project.godot"
          "$GODOT" --headless --path "$audit_host" \
            --script "res://$audit_harness_name/audit_export_pck.gd" -- \
            "$pck" "$root/audit" "$project_so" \
            2>&1 | tee "$root/pck-audit.log"
          grep -q '^PCK_AUDIT_VIOLATIONS=0$' "$root/pck-audit.log"
          grep -q '^PCK_AUDIT_PROJECT_LIBRARIES=1$' "$root/pck-audit.log"
          if grep -E -q '(^| )ERROR:|SCRIPT ERROR:|WARNING:|Unable to open' \
              "$root/import.log" "$root/export.log" "$root/pck-audit.log"; then
            echo 'Godot reported an Android import/export diagnostic.'
            exit 1
          fi
          grep -q 'GDPP_AOT_SUMMARY scenes=' "$root/export.log"
