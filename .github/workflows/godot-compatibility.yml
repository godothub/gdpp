name: Godot compatibility

on:
  workflow_call:
    inputs:
      source_ref:
        description: Private source revision to validate
        type: string
        required: false
        default: main
      target:
        description: Compatibility target to run
        type: string
        required: false
        default: all
    secrets:
      GDPP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source revision to validate
        type: string
        required: false
        default: main
      target:
        description: Compatibility target to run
        type: choice
        required: true
        default: all
        options:
          - all
          - project-corpus
          - 4.4.1
          - 4.5.2
          - 4.6.3
          - 4.7.2

permissions:
  contents: read

env:
  GDPP_SOURCE_ROOT: ${{ github.workspace }}/source

defaults:
  run:
    working-directory: source

concurrency:
  group: godot-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    if: ${{ inputs.target != 'project-corpus' }}
    name: Godot / ${{ matrix.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(inputs.target != 'all' && inputs.target != 'project-corpus' && format('["{0}"]', inputs.target) || '["4.4.1","4.5.2","4.6.3","4.7.2"]') }}
    steps:
      - name: Check out public pipeline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GDPP_TOKEN }}
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          source-root: ${{ env.GDPP_SOURCE_ROOT }}
          version: ${{ matrix.version }}
          templates: linux
      - id: oracle
        name: Install the latest supported GDScript semantic oracle
        uses: ./.github/actions/setup-godot
        with:
          source-root: ${{ env.GDPP_SOURCE_ROOT }}
          version: 4.7.2
          templates: none
      - name: Install the official protobuf wire-format oracle
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Configure compiler plugin and SDK
        shell: bash
        run: >-
          cmake --preset plugin
          -DGDPP_GODOT_EXECUTABLE=${{ steps.godot.outputs.executable }}
          -DGDPP_GDSCRIPT_ORACLE_EXECUTABLE=${{ steps.oracle.outputs.executable }}
          -DGDPP_BUILD_PERFORMANCE_BASELINE=ON
      - name: Build compiler plugin and direct native targets
        run: cmake --build --preset plugin --parallel
      - name: Run compiler and Godot integration tests
        run: ctest --preset plugin
      - name: Export and run independent GDExtension inheritance project
        shell: bash
        env:
          GODOT: ${{ steps.godot.outputs.executable }}
          GODOT_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          fixture=build/plugin/attached-extension-project
          output="$fixture/export"
          mkdir -p "$output"
          cp "$fixture/extension_list.editor.cfg" \
            "$fixture/.godot/extension_list.cfg"

          "$GODOT" --headless --editor --path "$fixture" --import \
            2>&1 | tee "$output/gdpp-attached-import.log"
          if [[ "$GODOT_VERSION" == 4.7.* ]]; then
            timeout 30s "$GODOT" --headless --path "$fixture" \
              --script res://runtime_fault_oracle.gd \
              2>&1 | tee "$output/gdpp-attached-fault-source.log"
            grep -q '^GDPP_FAULT_MATRIX=' \
              "$output/gdpp-attached-fault-source.log"
            grep -q '^GDPP_VALUE_MATRIX=' \
              "$output/gdpp-attached-fault-source.log"
            grep -q '^GDPP_AWAIT_DEFAULT_MATRIX=ok$' \
              "$output/gdpp-attached-fault-source.log"
            grep -q '^GDPP_COROUTINE_ACCESSOR_MATRIX=ok$' \
              "$output/gdpp-attached-fault-source.log"
          fi
          state="$GDPP_SOURCE_ROOT/build/ci/attached-${GODOT_VERSION}-extension-state.json"
          mkdir -p "$(dirname "$state")"
          python3 tools/verify_export_immutability.py snapshot \
            --project "$fixture" --state "$state"
          "$GODOT" --headless --editor --path "$fixture" \
            --export-release 'Linux x86_64' \
            "$GDPP_SOURCE_ROOT/$output/gdpp-attached.x86_64" \
            2>&1 | tee "$output/gdpp-attached-export.log"
          python3 tools/verify_export_immutability.py verify \
            --project "$fixture" --state "$state"

          test -x "$output/gdpp-attached.x86_64"
          test -f "$output/gdpp-attached.pck"
          test -f "$fixture/addons/vendor/binary/libgdpp_test_vendor.linux.x86_64.so"
          test -f "$fixture/addons/gdpp/binary/libgdpp.release.linux.x86_64.so"
          timeout 15s "$output/gdpp-attached.x86_64" --headless \
            2>&1 | tee "$output/gdpp-attached-runtime.log"
          timeout 30s "$output/gdpp-attached.x86_64" --headless -- \
            --gdpp-fault-matrix \
            2>&1 | tee "$output/gdpp-attached-fault-aot.log"
          timeout 15s "$output/gdpp-attached.x86_64" --headless -- \
            --gdpp-await-default-oracle \
            2>&1 | tee "$output/gdpp-attached-await-default-aot.log"
          timeout 15s "$output/gdpp-attached.x86_64" --headless -- \
            --gdpp-coroutine-accessor-oracle \
            2>&1 | tee "$output/gdpp-attached-accessor-aot.log"
          grep -q '^GDPP_DYNAMIC_SCRIPT_RUNTIME_OK$' \
            "$output/gdpp-attached-runtime.log"
          grep -q '^GDPP_ATTACHED_EXPORT_RUNTIME_OK$' \
            "$output/gdpp-attached-runtime.log"
          grep -q '^GDPP_FAULT_MATRIX=' "$output/gdpp-attached-fault-aot.log"
          grep -q '^GDPP_VALUE_MATRIX=' "$output/gdpp-attached-fault-aot.log"
          grep -q '^GDPP_AWAIT_DEFAULT_MATRIX=ok$' \
            "$output/gdpp-attached-fault-aot.log"
          grep -q '^GDPP_COROUTINE_ACCESSOR_MATRIX=ok$' \
            "$output/gdpp-attached-fault-aot.log"
          grep -q '^GDPP_AWAIT_DEFAULT_AOT_RUNTIME_OK$' \
            "$output/gdpp-attached-await-default-aot.log"
          grep -q '^GDPP_COROUTINE_ACCESSOR_AOT_RUNTIME_OK$' \
            "$output/gdpp-attached-accessor-aot.log"
          if [[ "$GODOT_VERSION" == 4.7.* ]]; then
            source_fault="$(grep '^GDPP_FAULT_MATRIX=' \
              "$output/gdpp-attached-fault-source.log" | tail -n 1)"
            aot_fault="$(grep '^GDPP_FAULT_MATRIX=' \
              "$output/gdpp-attached-fault-aot.log" | tail -n 1)"
            test "$source_fault" = "$aot_fault"
            source_values="$(grep '^GDPP_VALUE_MATRIX=' \
              "$output/gdpp-attached-fault-source.log" | tail -n 1)"
            aot_values="$(grep '^GDPP_VALUE_MATRIX=' \
              "$output/gdpp-attached-fault-aot.log" | tail -n 1)"
            test "$source_values" = "$aot_values"
          fi
          if grep -E -q 'ObjectDB instances were leaked|resources still in use at exit|Resource still in use' \
              "$output/gdpp-attached-runtime.log" \
              "$output/gdpp-attached-fault-aot.log" \
              "$output/gdpp-attached-await-default-aot.log" \
              "$output/gdpp-attached-accessor-aot.log"; then
            echo 'Attached GDExtension runtime retained engine objects during shutdown.'
            exit 1
          fi
          grep -q 'GDPP_AOT_SUMMARY scenes=' "$output/gdpp-attached-export.log"

          audit=build/attached-pck-audit
          mkdir -p "$audit"
          audit_harness="$audit/gdpp-pck-audit-$(python3 -c \
            'import secrets; print(secrets.token_hex(16))')"
          audit_harness_name="${audit_harness##*/}"
          mkdir "$audit_harness"
          cp tools/audit_attached_export_pck.gd \
            "$audit_harness/audit_attached_export_pck.gd"
          printf '[application]\nconfig/name="GDPP Attached PCK Audit"\n' \
            > "$audit/project.godot"
          "$GODOT" --headless --path "$audit" \
            --script "res://$audit_harness_name/audit_attached_export_pck.gd" -- \
            "$GDPP_SOURCE_ROOT/$output/gdpp-attached.pck" \
            2>&1 | tee "$output/gdpp-attached-pck-audit.log"
          grep -q '^GDPP_ATTACHED_PCK_VIOLATIONS=0$' \
            "$output/gdpp-attached-pck-audit.log"

          diagnostic_logs=(
            "$output/gdpp-attached-import.log"
            "$output/gdpp-attached-export.log"
            "$output/gdpp-attached-runtime.log"
            "$output/gdpp-attached-await-default-aot.log"
            "$output/gdpp-attached-accessor-aot.log"
            "$output/gdpp-attached-pck-audit.log"
          )

          if grep -E -q '(^| )ERROR:|SCRIPT ERROR:|Parse Error:|WARNING:|Unable to open' \
              "${diagnostic_logs[@]}"; then
            echo 'Attached GDExtension export emitted a forbidden diagnostic.'
            exit 1
          fi
      - name: Preflight project and export plugin
        shell: bash
        env:
          GODOT: ${{ steps.godot.outputs.executable }}
        run: |
          set -euo pipefail
          mkdir -p \
            example/addons/gdpp/build/export/aot \
            example/addons/gdpp/build/export/debug \
            example/addons/gdpp/build/export/gds
          "$GODOT" --headless --editor --path example --quit-after 120 \
            2>&1 | tee example/addons/gdpp/build/export/gdpp-warmup.log
          "$GODOT" --headless --editor --path example --import \
            2>&1 | tee example/addons/gdpp/build/export/gdpp-preflight.log
          mkdir -p build/ci
          python3 tools/verify_export_immutability.py snapshot \
            --project example --state build/ci/example-extension-state.json
          if grep -E -q '(^| )ERROR:|SCRIPT ERROR:|Parse Error:|WARNING:|Unable to open' \
              example/addons/gdpp/build/export/gdpp-preflight.log; then
            echo 'Godot project or export plugin failed its parse/load preflight.'
            exit 1
          fi
      - name: Export, run and audit binary-only project
        shell: bash
        env:
          GODOT: ${{ steps.godot.outputs.executable }}
        run: |
          set -euo pipefail
          output=example/addons/gdpp/build/export
          "$GODOT" --headless --editor --path example \
            --export-release 'Linux x86_64' \
            "$GDPP_SOURCE_ROOT/$output/aot/gdpp-runtime.x86_64" \
            2>&1 | tee "$output/gdpp-aot-export.log"
          python3 tools/verify_export_immutability.py verify \
            --project example --state build/ci/example-extension-state.json
          project=example/addons/gdpp/binary/libgdpp.release.linux.x86_64.so
          test -x "$output/aot/gdpp-runtime.x86_64"
          test -f "$project"
          test "$(nm -D --defined-only "$project" | awk 'NF {print $NF}' | wc -l)" -eq 1
          nm -D --defined-only "$project" | awk 'NF {print $NF}' | \
            grep -qx gdpp_library_init
          if readelf -S "$project" | grep '\.symtab' >/dev/null; then
            echo 'Linux Release project library contains a normal symbol table.'
            exit 1
          fi
          timeout 15s "$output/aot/gdpp-runtime.x86_64" --headless --quit-after 2 \
            2>&1 | tee "$output/gdpp-aot-runtime.log"
          grep -q '^GDPP_EXPORTED_PROPERTIES_OK$' "$output/gdpp-aot-runtime.log"
          grep -q '^GDPP_ASYNC_VIRTUAL_OK$' "$output/gdpp-aot-runtime.log"
          timeout 30s "$output/aot/gdpp-runtime.x86_64" \
            --headless --audio-driver Dummy -- --gdpp-coroutine-loop \
            2>&1 | tee "$output/gdpp-aot-coroutine-loop.log"
          grep -q '^GDPP_COROUTINE_LOOP_OK$' "$output/gdpp-aot-coroutine-loop.log"
          timeout 30s "$output/aot/gdpp-runtime.x86_64" \
            --headless --audio-driver Dummy -- --gdpp-runtime-failure \
            2>&1 | tee "$output/gdpp-aot-runtime-failure.log"
          grep -q '^GDPP_RUNTIME_FAILURE_OK$' "$output/gdpp-aot-runtime-failure.log"
          grep -q 'GDPP_AOT_SUMMARY scenes=' "$output/gdpp-aot-export.log"
          if grep -E -q '(^| )ERROR:|SCRIPT ERROR:|WARNING:|Unable to open' \
              "$output/gdpp-aot-export.log" "$output/gdpp-aot-runtime.log" \
              "$output/gdpp-aot-coroutine-loop.log"; then
            echo 'AOT export or runtime emitted a forbidden diagnostic.'
            exit 1
          fi

          mkdir -p build/pck-audit
          audit_harness="build/pck-audit/gdpp-pck-audit-$(python3 -c \
            'import secrets; print(secrets.token_hex(16))')"
          audit_harness_name="${audit_harness##*/}"
          mkdir "$audit_harness"
          cp tools/audit_export_pck.gd "$audit_harness/audit_export_pck.gd"
          printf '[application]\nconfig/name="GDPP PCK Audit"\n' > build/pck-audit/project.godot
          "$GODOT" --headless --path build/pck-audit \
            --script "res://$audit_harness_name/audit_export_pck.gd" -- \
            "$GDPP_SOURCE_ROOT/$output/aot/gdpp-runtime.pck" \
            "$GDPP_SOURCE_ROOT/$output/aot" "$GDPP_SOURCE_ROOT/$project" \
            2>&1 | tee "$output/gdpp-pck-audit.log"
          grep -q '^PCK_AUDIT_VIOLATIONS=0$' "$output/gdpp-pck-audit.log"
          grep -q '^PCK_AUDIT_PROJECT_LIBRARIES=1$' "$output/gdpp-pck-audit.log"
      - name: Export and run optimized Debug project with script assertions
        shell: bash
        env:
          GODOT: ${{ steps.godot.outputs.executable }}
          GODOT_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          output=example/addons/gdpp/build/export
          sdk=example/addons/gdpp/sdk/lib/linux/x86_64
          test "$(find "$sdk" -maxdepth 1 -type f -name '*.a' | wc -l)" -eq 1
          grep -q '^engine_range 4.4-4.7$' "$sdk/sdk.manifest"
          "$GODOT" --headless --editor --path example \
            --export-debug 'Linux x86_64' \
            "$GDPP_SOURCE_ROOT/$output/debug/gdpp-runtime-debug.x86_64" \
            2>&1 | tee "$output/gdpp-debug-export.log"
          python3 tools/verify_export_immutability.py verify \
            --project example --state build/ci/example-extension-state.json
          project=example/addons/gdpp/binary/libgdpp.debug.linux.x86_64.so
          test -x "$output/debug/gdpp-runtime-debug.x86_64"
          test -f "$project"
          test "$(nm -D --defined-only "$project" | awk 'NF {print $NF}' | wc -l)" -eq 1
          nm -D --defined-only "$project" | awk 'NF {print $NF}' | \
            grep -qx gdpp_library_init
          if readelf -S "$project" | grep '\.symtab' >/dev/null; then
            echo 'Linux Debug project library was not Release-stripped.'
            exit 1
          fi
          timeout 15s "$output/debug/gdpp-runtime-debug.x86_64" --headless --quit-after 2 \
            2>&1 | tee "$output/gdpp-debug-runtime.log"
          grep -q '^GDPP_EXPORTED_PROPERTIES_OK$' "$output/gdpp-debug-runtime.log"
          grep -q 'GDPP_AOT_SUMMARY scenes=' "$output/gdpp-debug-export.log"
          if grep -E -q '(^| )ERROR:|SCRIPT ERROR:|WARNING:|Unable to open' \
              "$output/gdpp-debug-export.log" "$output/gdpp-debug-runtime.log"; then
            echo 'Optimized Debug export or runtime emitted a forbidden diagnostic.'
            exit 1
          fi
      - name: Compare isolated GDScript baseline and AOT behavior/performance
        shell: bash
        env:
          GODOT: ${{ steps.godot.outputs.executable }}
        run: |
          set -euo pipefail
          output="$GDPP_SOURCE_ROOT/build/ci/performance"
          python3 tools/run_performance_gate.py \
            --source-root "$GDPP_SOURCE_ROOT" \
            --godot "$GODOT" \
            --project "$GDPP_SOURCE_ROOT/example" \
            --gds-preset 'Linux GDScript Baseline' \
            --aot-preset 'Linux x86_64' \
            --output-directory "$output" \
            --gds-output "$output/baseline/GDScript.x86_64" \
            --aot-output "$output/aot/AOT.x86_64" \
            --cpp-baseline \
              "$GDPP_SOURCE_ROOT/build/plugin/bin/gdpp_performance_native_baseline" \
            --report "$output/runtime-matrix.json" \
            --repeats 5 \
            --samples 9 \
            --iterations 100000
          python3 tools/verify_export_immutability.py verify \
            --project example --state build/ci/example-extension-state.json
      - name: Verify binary-only export fails closed without its SDK
        shell: bash
        env:
          GODOT: ${{ steps.godot.outputs.executable }}
        run: |
          set -euo pipefail
          sdk="example/addons/gdpp/sdk/lib/linux/x86_64"
          project="example/addons/gdpp/binary/libgdpp.release.linux.x86_64.so"
          test -f "$project"
          mv "$sdk" "$sdk.unavailable"
          mv "$project" "$project.unavailable"
          restore_fault_injection() {
            mv "$sdk.unavailable" "$sdk" 2>/dev/null || true
            mv "$project.unavailable" "$project" 2>/dev/null || true
          }
          trap restore_fault_injection EXIT
          set +e
          "$GODOT" --headless --editor --path example \
            --export-pack 'Linux x86_64' \
            "$GDPP_SOURCE_ROOT/example/addons/gdpp/build/export/gdpp-must-fail.pck" \
            > example/addons/gdpp/build/export/gdpp-must-fail.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0 || \
            grep -q 'binary-only export is blocked to prevent source disclosure' \
              example/addons/gdpp/build/export/gdpp-must-fail.log
          grep -q 'binary-only export is blocked to prevent source disclosure' \
            example/addons/gdpp/build/export/gdpp-must-fail.log
          python3 tools/verify_export_immutability.py verify \
            --project example --state build/ci/example-extension-state.json
      - id: evidence_audit
        name: Audit public compatibility evidence for source disclosure
        if: always()
        run: >-
          python3 "$GITHUB_WORKSPACE/.github/tools/audit_public_artifact.py"
          --source .
          --path
          example/addons/gdpp/build/export/*.log
          build/ci/performance/*.log
          build/ci/performance/runtime-matrix.json
          build/plugin/attached-extension-project/export/*.log
      - name: Upload compatibility evidence
        if: ${{ always() && steps.evidence_audit.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: godot-${{ matrix.version }}-compatibility
          path: |
            source/example/addons/gdpp/build/export/*.log
            source/build/ci/performance/*.log
            source/build/ci/performance/runtime-matrix.json
            source/build/plugin/attached-extension-project/export/*.log
          if-no-files-found: warn
          retention-days: 14

  project-corpus:
    if: ${{ inputs.target == 'all' || inputs.target == 'project-corpus' }}
    name: Project and parser corpora
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out public pipeline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GDPP_TOKEN }}
      - name: Verify the latest supported Godot stable frontend pin
        run: >-
          python3 tools/update_godot_frontend.py
          --manifest test/compatibility/godot_parser_4_7.json
          --snapshot test/compatibility/godot_frontend_4_7.json
          --language-features src/frontend/language_features.cpp
          --unicode-table include/gdpp/core/unicode_identifier_ranges.inc
          --build-root build
          --output build/godot-frontend-update
          --check-only
      - name: Configure project and parser corpora
        run: cmake --preset dev -DGDPP_ENABLE_COMPATIBILITY_CORPUS_TESTS=ON
      - name: Build compiler
        run: cmake --build --preset dev --parallel
      - name: Compile current project and parser corpora
        run: >-
          ctest --preset dev --verbose --output-on-failure
          -R '^gdpp\.compatibility\.'
      - id: report_audit
        name: Audit public compatibility reports for source disclosure
        if: always()
        run: >-
          python3 "$GITHUB_WORKSPACE/.github/tools/audit_public_artifact.py"
          --source .
          --path build/dev/compatibility/results/report.json
          --path build/dev/compatibility/parser-results/report.json
          --path build/dev/compatibility/frontend-snapshot-diff.json
      - name: Upload compatibility report
        if: ${{ always() && steps.report_audit.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-reports
          path: |
            source/build/dev/compatibility/results/report.json
            source/build/dev/compatibility/parser-results/report.json
            source/build/dev/compatibility/frontend-snapshot-diff.json
          if-no-files-found: warn
          retention-days: 14

  official-runtime-semantics:
    if: ${{ inputs.target == 'all' || inputs.target == 'project-corpus' || inputs.target == '4.7.2' }}
    name: Official GDScript runtime semantics
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out public pipeline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GDPP_TOKEN }}
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          source-root: ${{ env.GDPP_SOURCE_ROOT }}
          version: 4.7.2
          templates: linux
      - name: Configure the official runtime differential
        shell: bash
        run: >-
          cmake --preset plugin
          -DGDPP_GODOT_EXECUTABLE=${{ steps.godot.outputs.executable }}
          -DGDPP_GDSCRIPT_ORACLE_EXECUTABLE=${{ steps.godot.outputs.executable }}
          -DGDPP_ENABLE_COMPATIBILITY_CORPUS_TESTS=ON
      - name: Build the compiler, plugin and runtime fixture
        run: cmake --build --preset plugin --parallel
      - name: Run every directly runnable official GDScript case
        run: >-
          ctest --preset plugin --verbose --output-on-failure
          -R '^gdpp\.compatibility\.(fetch_parser_4_7|official_runtime_features)$'

  external-release-performance:
    if: ${{ inputs.target == 'all' || inputs.target == '4.7.2' }}
    name: External Release performance / Godot 4.7.2
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out public pipeline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GDPP_TOKEN }}
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          source-root: ${{ env.GDPP_SOURCE_ROOT }}
          version: 4.7.2
          templates: macos
      - name: Build the macOS editor add-on and universal Release SDK
        shell: bash
        run: >-
          cmake --preset plugin
          '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          -DGDPP_GODOT_EXECUTABLE=${{ steps.godot.outputs.executable }}
          -DGDPP_GDSCRIPT_ORACLE_EXECUTABLE=${{ steps.godot.outputs.executable }}
          &&
          cmake --build --preset plugin --parallel
      - name: Run source-identical public-project Release comparisons
        shell: bash
        run: >-
          python3 tools/run_external_performance_gate.py
          --godot ${{ steps.godot.outputs.executable }}
          --addon example/addons/gdpp
          --work-directory build/external-performance/work
          --output build/external-performance/evidence
          --host macos
          --samples 3
      - id: evidence_audit
        name: Audit public performance evidence for source disclosure
        if: always()
        run: >-
          python3 "$GITHUB_WORKSPACE/.github/tools/audit_public_artifact.py"
          --source .
          --path build/external-performance/evidence/*.json
          build/external-performance/evidence/*.log
      - name: Upload source-free external performance evidence
        if: ${{ always() && steps.evidence_audit.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: external-release-performance-4.7.2
          path: |
            source/build/external-performance/evidence/*.json
            source/build/external-performance/evidence/*.log
          if-no-files-found: error
          retention-days: 14

  external-projects:
    if: ${{ inputs.target == 'all' || inputs.target == 'project-corpus' }}
    name: External project / ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Konado
            id: konado
            manifest: test/compatibility/konado.json
            supplemental_engine: 4.7.2
          - name: Pixelorama
            id: pixelorama
            manifest: test/compatibility/pixelorama.json
            supplemental_engine: 4.7.2
          - name: Open RPG
            id: open-rpg
            manifest: test/compatibility/open_rpg.json
          - name: Source of Mana
            id: source-of-mana
            manifest: test/compatibility/source_of_mana.json
            supplemental_engine: 4.7.2
          - name: Terrain3D
            id: terrain3d
            manifest: test/compatibility/terrain3d.json
          - name: Godobuf
            id: godobuf
            manifest: test/compatibility/godobuf.json
          - name: Sunshine Clouds 2
            id: sunshine-clouds2
            manifest: test/compatibility/sunshine_clouds2.json
          - name: Dialogue Manager
            id: dialogue-manager
            manifest: test/compatibility/dialogue_manager.json
            supplemental_engine: 4.7.2
          - name: Phantom Camera
            id: phantom-camera
            manifest: test/compatibility/phantom_camera.json
    steps:
      - name: Check out public pipeline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-source
        with:
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GDPP_TOKEN }}
      - id: contract
        name: Read the upstream project's declared Godot contract
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          python3 - "$MANIFEST" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          from pathlib import Path
          from tools.validate_compatibility_godot import (
              load_manifest,
              manifest_contract,
              manifest_edition,
          )

          manifest = load_manifest(Path(sys.argv[1]))
          target, engine = manifest_contract(manifest)
          print(f"target={target}")
          print(f"engine={engine}")
          print(f"edition={manifest_edition(manifest)}")
          PY
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          source-root: ${{ env.GDPP_SOURCE_ROOT }}
          version: ${{ steps.contract.outputs.engine }}
          templates: linux
          edition: ${{ steps.contract.outputs.edition }}
      - name: Verify the declared .NET toolchain
        if: ${{ steps.contract.outputs.edition == 'dotnet' }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          dotnet --list-sdks | grep -E '^8\.'
      - name: Build the installed add-on and matching SDK
        shell: bash
        run: >-
          cmake --preset plugin
          -DGDPP_GODOT_EXECUTABLE=${{ steps.godot.outputs.executable }}
          &&
          cmake --build --preset plugin --parallel
      - name: Fetch the complete moving upstream project
        run: >-
          python3 tools/fetch_compatibility_corpus.py
          --manifest ${{ matrix.manifest }}
          --destination build/external-projects/${{ matrix.id }}
          --build-root build
      - name: Import, AOT build, export, audit and launch
        run: >-
          python3 tools/run_external_project_e2e.py
          --manifest ${{ matrix.manifest }}
          --corpus build/external-projects/${{ matrix.id }}
          --addon example/addons/gdpp
          --godot-executable ${{ steps.godot.outputs.executable }}
          --audit-script tools/audit_export_pck.gd
          --immutability-script tools/verify_export_immutability.py
          --output build/external-e2e/${{ matrix.id }}
          --host linux
          --mode primary
      - id: primary_evidence_audit
        name: Audit public primary complete-project evidence for source disclosure
        if: always()
        run: >-
          python3 "$GITHUB_WORKSPACE/.github/tools/audit_public_artifact.py"
          --source .
          --path
          build/external-e2e/${{ matrix.id }}/*.json
          build/external-e2e/${{ matrix.id }}/*.log
      - name: Upload primary complete-project evidence
        if: ${{ always() && steps.primary_evidence_audit.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: external-project-${{ matrix.id }}
          path: |
            source/build/external-e2e/${{ matrix.id }}/*.json
            source/build/external-e2e/${{ matrix.id }}/*.log
          if-no-files-found: warn
          retention-days: 14
      - id: supplemental_godot
        name: Install the supplemental Godot patch
        if: ${{ success() && matrix.supplemental_engine == '4.7.2' }}
        uses: ./.github/actions/setup-godot
        with:
          source-root: ${{ env.GDPP_SOURCE_ROOT }}
          version: ${{ matrix.supplemental_engine }}
          templates: linux
          edition: ${{ steps.contract.outputs.edition }}
      - name: Rebuild the installed add-on for the supplemental Godot patch
        if: ${{ success() && matrix.supplemental_engine == '4.7.2' }}
        shell: bash
        run: >-
          cmake --preset plugin
          -DGDPP_GODOT_EXECUTABLE=${{ steps.supplemental_godot.outputs.executable }}
          &&
          cmake --build --preset plugin --parallel
      - name: Run the source-identical supplemental complete-project lifecycle
        if: ${{ success() && matrix.supplemental_engine == '4.7.2' }}
        run: >-
          python3 tools/run_external_project_e2e.py
          --manifest ${{ matrix.manifest }}
          --corpus build/external-projects/${{ matrix.id }}
          --addon example/addons/gdpp
          --godot-executable ${{ steps.supplemental_godot.outputs.executable }}
          --audit-script tools/audit_export_pck.gd
          --immutability-script tools/verify_export_immutability.py
          --output build/external-e2e/${{ matrix.id }}-supplemental-${{ matrix.supplemental_engine }}
          --host linux
          --mode supplemental
          --primary-report build/external-e2e/${{ matrix.id }}/report.json
      - id: supplemental_evidence_audit
        name: Audit public supplemental complete-project evidence for source disclosure
        if: ${{ always() && matrix.supplemental_engine == '4.7.2' }}
        run: >-
          python3 "$GITHUB_WORKSPACE/.github/tools/audit_public_artifact.py"
          --source .
          --path
          build/external-e2e/${{ matrix.id }}-supplemental-${{ matrix.supplemental_engine }}/*.json
          build/external-e2e/${{ matrix.id }}-supplemental-${{ matrix.supplemental_engine }}/*.log
      - name: Upload supplemental complete-project evidence
        if: ${{ always() && steps.supplemental_evidence_audit.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: external-project-${{ matrix.id }}-supplemental-${{ matrix.supplemental_engine }}
          path: |
            source/build/external-e2e/${{ matrix.id }}-supplemental-${{ matrix.supplemental_engine }}/*.json
            source/build/external-e2e/${{ matrix.id }}-supplemental-${{ matrix.supplemental_engine }}/*.log
          if-no-files-found: warn
          retention-days: 14
